<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert Page</title>
</head>

<body>

    <center style="border-color: black;">
        <form action="Insert" method="post" style="background-color: yellow; width: 500px;margin-top: 100px; height: 300px; border-color: black; border: dotted;">

<br><br>
<label for="">Enter Id : </label>
        <input type="text" placeholder="Id" name="id"> <br><br>
        <label for="">Enter Name : </label>

        <input type="text" placeholder="Name" name="name"><br><br>
        <label for="">Enter Marks : </label>
        <input type="text" placeholder="Marks" name="marks"><br><br>
        <label for="">Enter Age</label>
        <input type="text" placeholder="Age" name="age"><br><br>
        <label for="">Enter location : </label>
        <input type="text" placeholder="Location" name="location"><br><br>

        <label for="">Gender :</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
<input type="submit" value="submit" style="border-radius: 5px;">
        </form>
    </center>



</body>

</html>
