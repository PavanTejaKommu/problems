<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>update</title>
</head>
<body>
<center>

<h1>select by which element you want ot update </h1>
<form action="Update"  method="post" style="background-color: yellow; width: 500px;margin-top: 100px; height: 400px; border-color: black; border: dotted;">
    <br><br>
    <label for="">Select By : </label>
    <br><br>

    <input type="radio" id="id" name="selectBy" value="Id">
    <label for="id">Id</label>

    <input type="radio" id="name" name="selectBy" value="Name">
    <label for="name">Name</label>

    <input type="radio" id="age" name="selectBy" value="Age">
    <label for="age">Age</label>

    <input type="radio" id="marks" name="selectBy" value="Marks">
    <label for="marks">Marks</label>

    <input type="radio" id="gender" name="selectBy" value="Gender">
    <label for="gender">Gender</label>

    <input type="radio" id="location" name="selectBy" value="Location">
    <label for="location">Location</label>

    <h1>select what you want to update</h1>

    <br><br>

    <label for="">update value : </label>
    <br><br>

    <input type="radio" id="id-1" name="updateValue" value="Id">
    <label for="id-1">Id</label>

    <input type="radio" id="name-1" name="updateValue" value="Name">
    <label for="name-1">Name</label>

    <input type="radio" id="age-1" name="updateValue" value="Age">
    <label for="age-1">Age</label>

    <input type="radio" id="marks-1" name="updateValue" value="Marks">
    <label for="marks-1">Marks</label>

    <input type="radio" id="gender-1" name="updateValue" value="Gender">
    <label for="gender-1">Gender</label>

    <input type="radio" id="location-1" name="updateValue" value="Location">
    <label for="location-1">Location</label>
<br><br>
<label for="">Enter select by value : </label>
<input type="text" name="selectValue"  placeholder="Enter select by value" >
<br><br>
<label for="">Enter  value  to be update : </label>
<input type="text" name="updatedValue"  placeholder="Enter  value  to be update" >
<br><br>
<input type="submit">
</form>


</center>
</body>
</html>
